name: Init debug keystore
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Idempotent guard
        id: guard
        run: |
          if [ -f debug.keystore ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "debug.keystore already exists; keeping the existing signing identity."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate debug keystore
        if: steps.guard.outputs.exists == 'false'
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storetype JKS -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
      - name: Commit debug keystore
        if: steps.guard.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug.keystore
          git commit -m "Add static debug keystore for stable CI signing"
          git push
