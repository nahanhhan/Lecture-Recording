name: 新建 Issue
description: 报告缺陷或提出新功能建议
title: "[Bug/Feat]: "
labels: []
body:
  - type: textarea
    id: description
    attributes:
      label: 描述
      description: 详细说明该 issue 的内容（缺陷现象或功能需求）
      placeholder: 请描述遇到的问题或期望的功能...
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: 复现步骤 / 补充信息
      description: （可选）如果是 bug，请提供复现步骤、期望行为与实际行为；如果是 feat，可补充使用场景
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志上传
      description: （可选）粘贴相关日志，或将日志文件拖拽到下方文本框中上传（可同时附上设备型号、系统版本、App 版本等环境信息）
      placeholder: 请粘贴日志内容，或拖拽日志文件到此处...
      render: shell
    validations:
      required: false
